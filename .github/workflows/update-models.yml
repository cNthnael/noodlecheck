# update-models.yml v1.0 - 2026-11-12 09:00 WIB
# Rebuilds models-extra.js once a week so NoodleCheck can show size, type and a direct link for more models.
name: Update model catalogue
on:
  schedule:
    - cron: '17 2 * * 1'   # Mondays 02:17 UTC (09:17 WIB)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crawl model sources
        run: python tools/crawl_models.py models-extra.js
      - name: Commit if changed
        run: |
          git config user.name "noodlecheck-bot"
          git config user.email "noodlecheck-bot@users.noreply.github.com"
          git add models-extra.js
          git diff --cached --quiet || git commit -m "Update model catalogue"
          git push
