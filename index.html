<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoodleCheck</title>
   <meta name="google-site-verification" content="T6E5_j7xpRVVDMLPrsUbla7BMHWZbsPf24iiTwJXcC4" />
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: ComfyUI's own dark workspace. Graph canvas fills the left, a fixed inspector column on the right;
   on narrow screens the column drops under the canvas. Single dark theme on purpose: it mirrors the ComfyUI default palette. */
:root{
  color-scheme:dark;
  --canvas:#141414; --bg:#202020; --menu:#171718; --raised:#2a2a2b; --line:#3a3a3c; --line-strong:#4e4e4e;
  --fg:#ffffff; --text:#dddddd; --muted:#999999;
  --accent:#58a6ff;
  --ok:#5fd38d; --warn:#ffa931; --err:#ff5c5c; --note:#8fb3d9;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-graph:Inter,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
button,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono)}

header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--menu);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;white-space:nowrap}
.brand b{color:var(--fg);font-size:15px;font-weight:600}
.brand span{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--raised);border:1px solid var(--line-strong);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#353537;border-color:#666}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:500}
.btn.primary:hover{background:#3880f0}
.btn.small{padding:3px 8px;font-size:12px}
select.btn{padding-right:8px}
label.sel{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
#stage{position:relative;background:var(--canvas);min-height:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
.overlay{position:absolute;pointer-events:none}
.overlay>*{pointer-events:auto}
#crumbs{top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{background:rgba(23,23,24,.92);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--text)}
.pill button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
#zoom{right:12px;bottom:12px;display:flex;gap:6px}
#zoom .btn{min-width:36px;background:rgba(23,23,24,.92)}
#legend{left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 190px);background:rgba(23,23,24,.92);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--muted)}
#legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
#inspector{left:12px;bottom:12px;width:min(340px,calc(100% - 24px));max-height:55%;overflow:auto;background:rgba(23,23,24,.96);border:1px solid var(--line-strong);border-radius:8px;padding:12px;display:none}
#inspector h3{margin:0 0 2px;font-size:14px;color:var(--fg);overflow-wrap:anywhere}
#inspector .close{float:right;margin:-4px -4px 0 8px}
.kv{display:grid;grid-template-columns:minmax(70px,38%) 1fr;gap:2px 10px;font-size:12px;margin-top:8px}
.kv dt{color:var(--muted);overflow-wrap:anywhere}
.kv dd{margin:0;font-family:var(--font-mono);overflow-wrap:anywhere;max-height:5.8em;overflow:hidden}
#drop{inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,20,20,.86);border:2px dashed var(--accent);font-size:18px;color:var(--fg);z-index:5;pointer-events:none}
body.dragging #drop{display:flex}

aside{background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
section{padding:14px 16px;border-bottom:1px solid var(--line)}
h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
h2 span{font-variant-numeric:tabular-nums;letter-spacing:0}
.status{display:flex;gap:12px;align-items:flex-start}
.badge{flex:none;font-weight:600;font-size:13px;letter-spacing:.06em;padding:6px 12px;border-radius:6px;border:1px solid currentColor;display:flex;align-items:center;gap:8px}
.badge::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.badge.ready{color:var(--ok);background:rgba(95,211,141,.1)}
.badge.warning{color:var(--warn);background:rgba(255,169,49,.1)}
.badge.warning::before{border-radius:2px;transform:rotate(45deg)}
.badge.error{color:var(--err);background:rgba(255,92,92,.1)}
.badge.error::before{border-radius:1px}
.status p{margin:0}
.fname{color:var(--fg);font-weight:500;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:12px}
.headline{font-size:18px;font-weight:600;color:var(--fg);margin:0 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line-strong);border-radius:4px;padding:1px 7px;font-size:12px;color:var(--text);background:var(--raised)}
.desc{margin:8px 0 0;max-width:65ch}
.pipe{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;margin-top:12px;font-size:12px}
.pipe .track{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.pipe .fill{height:100%;background:#6f7f95;border-radius:3px}
.pipe .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--menu);border:1px solid var(--line);border-left-width:3px;border-radius:6px;padding:9px 11px}
.item.error{border-left-color:var(--err)} .item.warning{border-left-color:var(--warn)} .item.note{border-left-color:var(--note)}
.item.req{border-left-color:var(--fg)} .item.opt{border-left-color:#666}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .t{color:var(--fg);font-weight:500;overflow-wrap:anywhere;min-width:0}
.item .d{margin:4px 0 0;color:var(--text);font-size:13px;overflow-wrap:anywhere}
.item .m{margin:4px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.lvl{flex:none;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.lvl.error{color:var(--err)} .lvl.warning{color:var(--warn)} .lvl.note{color:var(--note)}
.lvl.req{color:var(--fg);background:rgba(255,255,255,.08)} .lvl.opt{color:var(--muted)}
.cat{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.file{font-family:var(--font-mono);font-size:12.5px;color:var(--fg);overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:12.5px;text-align:left}
.empty{color:var(--muted);margin:0}
.foot{color:var(--muted);font-size:12px}
.foot p{margin:0 0 6px}

dialog{background:var(--bg);color:var(--text);border:1px solid var(--line-strong);border-radius:10px;padding:16px;width:min(640px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 8px;color:var(--fg);font-size:15px}
dialog textarea{width:100%;height:260px;background:#222;border:1px solid var(--line-strong);border-radius:6px;padding:8px;font:12px/1.4 var(--font-mono);resize:vertical}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}

@media (max-width:860px){
  body{overflow:auto;display:block}
  html,body{height:auto}
  main{display:block}
  #stage{height:62vh;min-height:320px}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  #legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>NoodleCheck</b><span>workflow checker for ComfyUI</span></div>
  <div class="bar">
    <label class="sel" for="examples">Examples
      <select id="examples" class="btn">
        <option value="default">ComfyUI default workflow</option>
        <option value="krea">Krea 2 Turbo, official template</option>
        <option value="broken">Broken workflow</option>
      </select>
    </label>
    <button class="btn" id="btn-paste" type="button">Paste JSON</button>
    <button class="btn" id="btn-copy" type="button">Copy report</button>
    <button class="btn primary" id="btn-open" type="button">Open workflow file</button>
    <input type="file" id="file" accept=".json,.png,application/json,image/png" hidden>
  </div>
</header>
<main>
  <div id="stage">
    <canvas id="cv" aria-label="Workflow graph. Drag to pan, scroll or pinch to zoom, click a node for details."></canvas>
    <div class="overlay" id="crumbs"></div>
    <div class="overlay" id="legend"></div>
    <div class="overlay" id="inspector"></div>
    <div class="overlay" id="zoom">
      <button class="btn" id="z-out" type="button" aria-label="Zoom out">&minus;</button>
      <button class="btn" id="z-in" type="button" aria-label="Zoom in">+</button>
      <button class="btn" id="z-fit" type="button">Fit</button>
    </div>
    <div class="overlay" id="drop">Drop a workflow .json or a ComfyUI .png</div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

<dialog id="dlg-paste">
  <h3>Paste workflow JSON</h3>
  <textarea id="paste-text" spellcheck="false" placeholder='{"nodes": [...], "links": [...]}'></textarea>
  <div class="row"><button class="btn" id="paste-cancel" type="button">Cancel</button><button class="btn primary" id="paste-go" type="button">Check workflow</button></div>
</dialog>
<dialog id="dlg-report">
  <h3>Report</h3>
  <textarea id="report-text" readonly spellcheck="false"></textarea>
  <div class="row"><button class="btn primary" id="report-close" type="button">Close</button></div>
</dialog>

<script src="data.js"></script>
<script src="samples.js"></script>
<script src="engine.js"></script>
